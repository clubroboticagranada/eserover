<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ESERover Mission Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-red: #ff0055;
            --panel-bg: rgba(16, 18, 27, 0.95);
            --border-color: #00f2ff55;
        }

        body { 
            background: #050505; 
            color: var(--neon-blue); 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; padding: 20px;
            background-image: radial-gradient(circle at center, #0a111a 0%, #050505 100%);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .glass-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
            padding: 15px;
            position: relative;
        }

        .glass-panel::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue);
        }

        h1, h3 { text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 8px var(--neon-blue); margin-top: 0; text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }

        /* Cluster de Navegación en Cruz */
        .nav-container {
            display: flex;
            justify-content: center;
            padding: 20px 0;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(3, 70px);
            gap: 10px;
        }

        .btn-nav {
            background: rgba(0, 242, 255, 0.05);
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .btn-nav:hover { background: var(--neon-blue); color: black; box-shadow: 0 0 20px var(--neon-blue); }
        .btn-nav:active { transform: scale(0.9); }

        /* Posiciones específicas */
        .fwd { grid-column: 2; grid-row: 1; }
        .lft { grid-column: 1; grid-row: 2; }
        .rgt { grid-column: 3; grid-row: 2; }
        .bck { grid-column: 2; grid-row: 3; }

        /* Stats y Tabla */
        .stats-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; margin-top: 10px; }
        .stats-table th { text-align: left; color: #555; border-bottom: 1px solid var(--border-color); }
        .stats-table td { padding: 8px 0; border-bottom: 1px solid #111; }
        .val-highlight { color: #fff; font-weight: bold; }

        #chartWrapper { height: 400px; }

        .footer-controls {
            grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center;
        }

        .rec-indicator { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; }
        .blink-dot { width: 10px; height: 10px; background: #222; border-radius: 50%; }
        .active-rec .blink-dot { background: var(--neon-red); animation: blink 1s infinite; box-shadow: 0 0 8px var(--neon-red); }

        @keyframes blink { 50% { opacity: 0.2; } }
    </style>
</head>
<body>

    <h1>ESERover control system 1.2</h1>

    <div class="main-grid">
        
        <!-- Columna Izquierda -->
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div class="glass-panel">
                <h3>MANUAL STEERING</h3>
                <div class="nav-container">
                    <div class="nav-grid">
                        <button class="btn-nav fwd" onclick="publish('movimiento', 'adelante')">▲</button>
                        <button class="btn-nav lft" onclick="publish('movimiento', 'izquierda')">◀</button>
                        <button class="btn-nav rgt" onclick="publish('movimiento', 'derecha')">▶</button>
                        <button class="btn-nav bck" onclick="publish('movimiento', 'atras')">▼</button>
                    </div>
                </div>
            </div>

            <div class="glass-panel">
                <h3>SENSOR ANALYTICS</h3>
                <table class="stats-table">
                    <thead><tr><th>ID</th><th>MIN</th><th>MAX</th><th>AVG</th></tr></thead>
                    <tbody id="statsBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Columna Derecha: Gráfica -->
        <div class="glass-panel">
            <h3>TELEMETRY VISUALIZER</h3>
            <div id="chartWrapper">
                <canvas id="shipChart"></canvas>
            </div>
        </div>

        <!-- Pie de página -->
        <div class="footer-controls glass-panel">
            <div class="rec-indicator" id="recStatus">
                <div class="blink-dot"></div>
                <span id="recText">RECORDER: INACTIVE</span>
            </div>
            <div>
                <button class="btn-nav" style="display:inline; padding: 5px 15px;" onclick="toggleRecording()">TOGGLE LOG</button>
                <button class="btn-nav" style="display:inline; padding: 5px 15px; border-color: #f1c40f; color: #f1c40f;" onclick="downloadCSV()">EXPORT .CSV</button>
            </div>
        </div>
    </div>

    <script>
        const client = new Paho.MQTT.Client("mqtt-dashboard.com", 8884, "eserover_" + Math.random().toString(16).slice(2));
        const sensorTopics = ["sensores/luz", "sensores/sonido", "sensores/temperatura", "sensores/humedad", "sensores/distancia"];
        
        let stats = {};
        sensorTopics.forEach(t => stats[t] = { history: [], min: Infinity, max: -Infinity, avg: 0 });

        let fullLog = [];
        let isRecording = false;

        // Chart setup
        const ctx = document.getElementById('shipChart').getContext('2d');
        Chart.defaults.color = '#00f2ff';
        const shipChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: sensorTopics.map((topic, i) => ({
                    label: topic.split('/')[1].toUpperCase(),
                    borderColor: ['#00f2ff', '#ff0055', '#f1c40f', '#2ecc71', '#9b59b6'][i],
                    data: [],
                    borderWidth: 1.5,
                    pointRadius: 0,
                    tension: 0.3
                }))
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { grid: { color: '#111' }, ticks: { display: false } },
                    y: { grid: { color: '#111' } }
                },
                plugins: { legend: { position: 'bottom' } }
            }
        });

        client.connect({
            onSuccess: () => {
                sensorTopics.forEach(t => client.subscribe(t));
                updateTableUI();
            },
            useSSL: true
        });

        client.onMessageArrived = (msg) => {
            const val = parseFloat(msg.payloadString);
            const topic = msg.destinationName;
            const now = new Date().toLocaleTimeString();

            const idx = sensorTopics.indexOf(topic);
            if(idx === -1) return;

            // Update Chart
            if (shipChart.data.labels.length > 40) {
                shipChart.data.labels.shift();
                shipChart.data.datasets.forEach(d => d.data.shift());
            }
            if (shipChart.data.labels[shipChart.data.labels.length - 1] !== now) shipChart.data.labels.push(now);
            shipChart.data.datasets[idx].data.push(val);
            shipChart.update('none');

            // Update Stats
            const s = stats[topic];
            s.history.push(val);
            s.min = Math.min(s.min, val);
            s.max = Math.max(s.max, val);
            s.avg = (s.history.reduce((a, b) => a + b, 0) / s.history.length).toFixed(1);
            
            updateTableUI();
            if (isRecording) fullLog.push({ now, topic, val });
        };

        function updateTableUI() {
            document.getElementById('statsBody').innerHTML = sensorTopics.map(t => `
                <tr>
                    <td>${t.split('/')[1].toUpperCase()}</td>
                    <td class="val-highlight">${stats[t].min === Infinity ? '0' : stats[t].min}</td>
                    <td class="val-highlight">${stats[t].max === -Infinity ? '0' : stats[t].max}</td>
                    <td style="color:var(--neon-blue)">${stats[t].avg}</td>
                </tr>
            `).join('');
        }

        function publish(t, m) {
            const message = new Paho.MQTT.Message(m);
            message.destinationName = t;
            client.send(message);
        }

        function toggleRecording() {
            isRecording = !isRecording;
            document.getElementById('recStatus').classList.toggle('active-rec');
            document.getElementById('recText').innerText = isRecording ? "SYSTEM RECORDING..." : "RECORDER: INACTIVE";
        }

        function downloadCSV() {
            let csv = "Timestamp,Sensor,Value\n" + fullLog.map(r => `${r.now},${r.topic},${r.val}`).join("\n");
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `eserover_log_${Date.now()}.csv`;
            a.click();
        }
    </script>
</body>
</html>
